<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktiver Leseteppich – I, L, A, M, O, E</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');

    :root {
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --success: #16a34a;
      --success-light: #dcfce7;
      --accent: #f59e0b;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --border-color: #cbd5e1;
      --font-family: "Comic Neue", "Comic Sans MS", "Chalkboard", cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: #f8fafc;
      color: var(--text-dark);
      padding: 16px;
      line-height: 1.4;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 2px solid #e2e8f0;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      color: #1e3a8a;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #64748b;
      font-weight: bold;
    }

    /* Print header (hidden on screen) */
    .print-header {
      display: none;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #94a3b8;
    }

    .print-header .student-info {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Toolbar & Filter */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      background-color: #f1f5f9;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-weight: bold;
      color: #334155;
    }

    select {
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 10px;
      border: 2px solid #94a3b8;
      background-color: white;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus {
      border-color: var(--primary);
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      font-family: var(--font-family);
      font-size: 0.95rem;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-read-all {
      background-color: #2563eb;
      color: white;
    }
    .btn-read-all:hover {
      background-color: #1d4ed8;
    }

    .btn-reset {
      background-color: #ef4444;
      color: white;
    }
    .btn-reset:hover {
      background-color: #dc2626;
    }

    .btn-print {
      background-color: #0d9488;
      color: white;
    }
    .btn-print:hover {
      background-color: #0f766e;
    }

    /* Filter Chips */
    .filter-section {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
      padding: 10px 14px;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
    }

    .filter-label {
      font-size: 0.95rem;
      font-weight: bold;
      color: #64748b;
      margin-right: 4px;
    }

    .chip {
      background: white;
      border: 2px solid #cbd5e1;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      color: #334155;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Counter / Stars */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: bold;
      color: #475569;
    }

    .progress-bar-container {
      flex-grow: 1;
      margin: 0 16px;
      height: 14px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Carpet Grid */
    .carpet-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    @media (max-width: 650px) {
      .carpet-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
    }

    @media (max-width: 480px) {
      .carpet-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
    }

    /* Reading Card */
    .card {
      background-color: var(--card-bg);
      border: 3px solid #cbd5e1;
      border-radius: 14px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      user-select: none;
      position: relative;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 3px 6px rgba(0,0,0,0.03);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #93c5fd;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.12);
    }

    .card .text {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #1e293b;
    }

    .card .emoji {
      font-size: 1.25rem;
      margin-top: 2px;
    }

    /* Card States */
    .card.read {
      background-color: var(--success-light);
      border-color: var(--success);
      color: #14532d;
    }

    .card.read .text {
      color: #14532d;
    }

    .card.read::after {
      content: "✓";
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--success);
    }

    .card.speaking {
      border-color: #f59e0b;
      background-color: #fef3c7;
      transform: scale(1.04);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }

    .card.dimmed {
      opacity: 0.22;
      filter: grayscale(80%);
      transform: none !important;
    }

    /* Info text */
    .help-box {
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #1e40af;
      margin-top: 10px;
    }

    /* Print Styles */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .container {
        border: none;
        box-shadow: none;
        padding: 0;
        max-width: 100%;
      }
      .toolbar, .filter-section, .stats-bar, .help-box {
        display: none !important;
      }
      .print-header {
        display: block;
      }
      header h1 {
        font-size: 1.6rem;
      }
      .carpet-grid {
        grid-template-columns: repeat(4, 1fr) !important;
        gap: 12px;
      }
      .card {
        min-height: 80px;
        border: 2px solid #000;
        box-shadow: none !important;
        page-break-inside: avoid;
      }
      .card.read {
        background: transparent !important;
      }
      .card.read::after {
        display: none;
      }
      .card .text {
        font-size: 1.9rem;
        color: #000;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="print-header">
      <div class="student-info">
        <span>Name: _______________________________</span>
        <span>Datum: ______________</span>
      </div>
    </div>

    <header>
      <h1 id="titleDisplay">🧶 Leseteppich</h1>
      <p class="subtitle" id="subtitleDisplay">Buchstaben: I, L, A, M, O, E</p>
    </header>

    <div class="toolbar">
      <div class="select-group">
        <label for="carpetSelect">Stufe:</label>
        <select id="carpetSelect">
          <option value="1">Teppich 1: Buchstaben & kurze Silben</option>
          <option value="2">Teppich 2: Silbenmix (Synthese)</option>
          <option value="3">Teppich 3: Erste Wörter</option>
          <option value="4">Teppich 4: Bunter Lesemix</option>
        </select>
      </div>

      <div class="action-buttons">
        <button class="btn-read-all" id="btnReadAll" title="Liest die gesamte Auswahl der Reihe nach vor">▶ Alles vorlesen</button>
        <button class="btn-reset" id="btnReset" title="Setzt alle Häkchen zurück">↺ Zurücksetzen</button>
        <button class="btn-print" id="btnPrint" title="Druckt den Leseteppich als Arbeitsblatt">🖨 Drucken</button>
      </div>
    </div>

    <div class="filter-section">
      <span class="filter-label">Buchstaben-Lupe:</span>
      <button class="chip active" data-char="ALL">Alle</button>
      <button class="chip" data-char="I">I / i</button>
      <button class="chip" data-char="L">L / l</button>
      <button class="chip" data-char="A">A / a</button>
      <button class="chip" data-char="M">M / m</button>
      <button class="chip" data-char="O">O / o</button>
      <button class="chip" data-char="E">E / e</button>
    </div>

    <div class="stats-bar">
      <span>Gelesen: <strong id="readCount">0</strong> / <strong id="totalCount">0</strong></span>
      <div class="progress-bar-container">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="starIcon">⭐</span>
    </div>

    <div class="carpet-grid" id="grid"></div>

    <div class="help-box">
      💡 <strong>Tipp für Schüler:</strong> Klicke auf ein Kärtchen, um es laut zu hören und als gelesen zu markieren.
    </div>
  </div>

  <script>
    // Teppich-Inhalte ausschließlich aus: I, L, A, M, O, E
    const carpets = {
      1: {
        title: "Teppich 1: Buchstaben & Silben",
        items: [
          { text: "M", type: "consonant", speech: "M" },
          { text: "L", type: "consonant", speech: "L" },
          { text: "A", type: "vowel", speech: "A" },
          { text: "O", type: "vowel", speech: "O" },
          { text: "m", type: "consonant", speech: "m" },
          { text: "l", type: "consonant", speech: "l" },
          { text: "i", type: "vowel", speech: "i" },
          { text: "e", type: "vowel", speech: "e" },
          { text: "ma", speech: "maah" },
          { text: "mo", speech: "mooh" },
          { text: "la", speech: "laah" },
          { text: "lo", speech: "looh" },
          { text: "am", speech: "amm" },
          { text: "im", speech: "imm" },
          { text: "al", speech: "all" },
          { text: "el", speech: "ell" }
        ]
      },
      2: {
        title: "Teppich 2: Silbenmix (Synthese)",
        items: [
          { text: "ma", speech: "maah" },
          { text: "me", speech: "meeh" },
          { text: "mi", speech: "miih" },
          { text: "mo", speech: "mooh" },
          { text: "la", speech: "laah" },
          { text: "le", speech: "leeh" },
          { text: "li", speech: "liih" },
          { text: "lo", speech: "looh" },
          { text: "am", speech: "amm" },
          { text: "om", speech: "omm" },
          { text: "im", speech: "imm" },
          { text: "em", speech: "emm" },
          { text: "al", speech: "all" },
          { text: "ol", speech: "oll" },
          { text: "il", speech: "ill" },
          { text: "el", speech: "ell" }
        ]
      },
      3: {
        title: "Teppich 3: Erste Wörter",
        items: [
          { text: "Mama", speech: "Mama", emoji: "👩" },
          { text: "Oma", speech: "Oma", emoji: "👵" },
          { text: "Omi", speech: "Omi", emoji: "👵" },
          { text: "Opa", speech: "Opa", emoji: "👴" }, // Fallback-Check: P nicht erlaubt! Daher ersetzen durch echtes Wort:
          { text: "Ali", speech: "Ali", emoji: "👦" },
          { text: "Emma", speech: "Emma", emoji: "👧" },
          { text: "Leo", speech: "Leo", emoji: "🦁" },
          { text: "Lola", speech: "Lola", emoji: "👧" },
          { text: "Mia", speech: "Mia", emoji: "👧" },
          { text: "Mimi", speech: "Mimi", emoji: "🐱" },
          { text: "Memo", speech: "Memo", emoji: "📝" },
          { text: "Lama", speech: "Lama", emoji: "🦙" },
          { text: "Momo", speech: "Momo", emoji: "👦" },
          { text: "Mila", speech: "Mila", emoji: "👧" },
          { text: "male", speech: "male", emoji: "🎨" },
          { text: "Lila", speech: "Lila", emoji: "💜" },
          { text: "Ole", speech: "Ole", emoji: "👦" }
        ]
      },
      4: {
        title: "Teppich 4: Bunter Lesemix",
        items: [
          { text: "M", type: "consonant", speech: "M" },
          { text: "ma", speech: "maah" },
          { text: "Mama", speech: "Mama", emoji: "👩" },
          { text: "L", type: "consonant", speech: "L" },
          { text: "lo", speech: "looh" },
          { text: "Lama", speech: "Lama", emoji: "🦙" },
          { text: "Oma", speech: "Oma", emoji: "👵" },
          { text: "li", speech: "liih" },
          { text: "Mia", speech: "Mia", emoji: "👧" },
          { text: "me", speech: "meeh" },
          { text: "Leo", speech: "Leo", emoji: "🦁" },
          { text: "am", speech: "amm" },
          { text: "Lila", speech: "Lila", emoji: "💜" },
          { text: "il", speech: "ill" },
          { text: "Emma", speech: "Emma", emoji: "👧" },
          { text: "male", speech: "male", emoji: "🎨" }
        ]
      }
    };

    // Korrektur Teppich 3 (falls 16 Felder gewünscht)
    carpets[3].items = carpets[3].items.filter(it => it.text !== "Opa"); // Sicherstellung: nur I, L, A, M, O, E

    let currentCarpetId = "1";
    let activeFilterChar = "ALL";
    let readCards = new Set();
    let isReadingAll = false;

    // Web Audio API für phonetische Einzellautung (M und L summen / schwingen)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playConsonantHum(char) {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // Laut M summen (~140Hz warm), Laut L resonieren (~220Hz)
        const freq = (char.toUpperCase() === 'M') ? 145 : 220;
        osc.type = (char.toUpperCase() === 'M') ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.48);
      } catch (e) {
        console.warn("AudioContext nicht verfügbar:", e);
      }
    }

    // Sprachausgabe per SpeechSynthesis
    function speakText(text, speechHint, type) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      // Bei isolierten Konsonanten: synthetischer Naturton (kein "Em" / "El") + Flüsterlaut
      if (type === "consonant") {
        playConsonantHum(text);
        const utt = new SpeechSynthesisUtterance(text.toLowerCase() + "...");
        utt.lang = 'de-DE';
        utt.rate = 0.7;
        utt.pitch = 0.8;
        window.speechSynthesis.speak(utt);
        return;
      }

      // Für Silben oder Wörter
      const phrase = speechHint || text;
      const utterance = new SpeechSynthesisUtterance(phrase);
      utterance.lang = 'de-DE';
      utterance.rate = 0.75; // kindgerecht verlangsamt
      utterance.pitch = 1.05;

      // Deutsche Stimme priorisieren
      const voices = window.speechSynthesis.getVoices();
      const deVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Google') || v.name.includes('Natural') || v.default));
      if (deVoice) utterance.voice = deVoice;

      window.speechSynthesis.speak(utterance);
    }

    const grid = document.getElementById('grid');
    const carpetSelect = document.getElementById('carpetSelect');
    const readCountEl = document.getElementById('readCount');
    const totalCountEl = document.getElementById('totalCount');
    const progressFill = document.getElementById('progressFill');
    const btnReset = document.getElementById('btnReset');
    const btnReadAll = document.getElementById('btnReadAll');
    const btnPrint = document.getElementById('btnPrint');
    const filterChips = document.querySelectorAll('.chip');
    const titleDisplay = document.getElementById('titleDisplay');

    function renderCarpet() {
      const carpet = carpets[currentCarpetId];
      titleDisplay.textContent = carpet.title;
      grid.innerHTML = '';
      readCards.clear();
      updateStats();

      carpet.items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;
        card.dataset.text = item.text.toUpperCase();

        const textSpan = document.createElement('div');
        textSpan.className = 'text';
        textSpan.textContent = item.text;
        card.appendChild(textSpan);

        if (item.emoji) {
          const emojiSpan = document.createElement('div');
          emojiSpan.className = 'emoji';
          emojiSpan.textContent = item.emoji;
          card.appendChild(emojiSpan);
        }

        card.addEventListener('click', () => {
          card.classList.toggle('read');
          if (card.classList.contains('read')) {
            readCards.add(index);
          } else {
            readCards.delete(index);
          }
          speakText(item.text, item.speech, item.type);
          updateStats();
        });

        grid.appendChild(card);
      });

      applyFilter();
    }

    function updateStats() {
      const total = carpets[currentCarpetId].items.length;
      const count = readCards.size;
      readCountEl.textContent = count;
      totalCountEl.textContent = total;
      const pct = total === 0 ? 0 : Math.round((count / total) * 100);
      progressFill.style.width = pct + '%';
    }

    function applyFilter() {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const txt = card.dataset.text;
        if (activeFilterChar === 'ALL' || txt.includes(activeFilterChar)) {
          card.classList.remove('dimmed');
        } else {
          card.classList.add('dimmed');
        }
      });
    }

    // Filter Chips Event
    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        filterChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeFilterChar = chip.dataset.char;
        applyFilter();
      });
    });

    // Teppichwechsel
    carpetSelect.addEventListener('change', (e) => {
      currentCarpetId = e.target.value;
      window.speechSynthesis.cancel();
      isReadingAll = false;
      btnReadAll.textContent = "▶ Alles vorlesen";
      renderCarpet();
    });

    // Zurücksetzen
    btnReset.addEventListener('click', () => {
      window.speechSynthesis.cancel();
      isReadingAll = false;
      btnReadAll.textContent = "▶ Alles vorlesen";
      const cards = document.querySelectorAll('.card');
      cards.forEach(c => c.classList.remove('read'));
      readCards.clear();
      updateStats();
    });

    // Drucken
    btnPrint.addEventListener('click', () => {
      window.print();
    });

    // Alles vorlesen (sequenziell)
    btnReadAll.addEventListener('click', () => {
      if (isReadingAll) {
        window.speechSynthesis.cancel();
        isReadingAll = false;
        btnReadAll.textContent = "▶ Alles vorlesen";
        document.querySelectorAll('.card').forEach(c => c.classList.remove('speaking'));
        return;
      }

      isReadingAll = true;
      btnReadAll.textContent = "⏹ Stopp";

      const carpet = carpets[currentCarpetId];
      const cards = document.querySelectorAll('.card');
      let idx = 0;

      function speakNext() {
        if (!isReadingAll || idx >= carpet.items.length) {
          isReadingAll = false;
          btnReadAll.textContent = "▶ Alles vorlesen";
          cards.forEach(c => c.classList.remove('speaking'));
          return;
        }

        const item = carpet.items[idx];
        const currentCard = cards[idx];

        cards.forEach(c => c.classList.remove('speaking'));
        currentCard.classList.add('speaking');
        currentCard.classList.add('read');
        readCards.add(idx);
        updateStats();

        // Laut abspielen
        if (item.type === 'consonant') {
          playConsonantHum(item.text);
        }

        const phrase = item.speech || item.text;
        const utt = new SpeechSynthesisUtterance(item.type === 'consonant' ? item.text.toLowerCase() : phrase);
        utt.lang = 'de-DE';
        utt.rate = 0.72;

        utt.onend = () => {
          currentCard.classList.remove('speaking');
          idx++;
          setTimeout(speakNext, 450); // Pause zwischen Kärtchen
        };

        utt.onerror = () => {
          currentCard.classList.remove('speaking');
          idx++;
          setTimeout(speakNext, 300);
        };

        window.speechSynthesis.speak(utt);
      }

      speakNext();
    });

    // Initiale Stimmen laden
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // Init
    renderCarpet();
  </script>
</body>
</html>
